<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Suíte de Testes Automatizados no Navegador - Calculadora Web Pyodide</title>
  <link rel="stylesheet" href="./style.css">
  <style>
    .pagina-testes .app-header {
      width: 100%;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.35rem;
      padding: 4px 4px 14px;
      text-align: center;
    }
    .pagina-testes .app-header .app-titulo,
    .pagina-testes .app-header .app-subtitulo {
      margin: 0;
      text-align: center;
    }
    .pagina-testes .app-header p:last-child {
      margin: 0.5rem 0 0;
    }
    .pagina-testes .calc-card {
      width: 100%;
    }
    @media (max-width: 640px) {
      .pagina-testes .barra-acoes-testes {
        flex-wrap: wrap;
        justify-content: center !important;
        gap: 0.75rem;
      }
      .pagina-testes #resumo-geral { text-align: center; }
      .pagina-testes .calc-card { overflow-x: auto; }
      .pagina-testes .tabela-testes { min-width: 620px; }
    }
    .tabela-testes {
      width: 100%;
      border-collapse: collapse;
      margin-top: 1rem;
      font-size: 0.875rem;
    }
    .tabela-testes {
      color: var(--text-main);
    }
    .tabela-testes th, .tabela-testes td {
      border: 1px solid var(--border);
      padding: 0.625rem 0.75rem;
      text-align: left;
    }
    .tabela-testes th {
      background-color: var(--bg-panel-soft);
      font-weight: 700;
    }
    .tag-status {
      display: inline-block;
      padding: 0.125rem 0.5rem;
      border-radius: 4px;
      font-weight: 700;
      font-size: 0.75rem;
    }
    .tag-sucesso { background-color: var(--success); color: #fff; }
    .tag-falha { background-color: var(--danger); color: #fff; }
  </style>
</head>
<body class="pagina-testes">
  <div class="app-container" style="max-width: 760px;">
    <header class="app-header">
      <h1 class="app-titulo">Suíte de Testes Automatizados no Navegador</h1>
      <p class="app-subtitulo">31 cenários: interface atual e integração com Pyodide</p>
      <p style="margin-top: 0.5rem;"><a href="./index.html">← Voltar para a Calculadora</a></p>
    </header>

    <main class="calc-card">
      <div class="barra-acoes-testes" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
        <div>
          <button id="btn-rodar-testes" class="btn btn-primario" style="flex: none; padding: 0.5rem 1rem;">
            Executar Bateria de Testes (31)
          </button>
        </div>
        <div id="resumo-geral" style="font-weight: 600; font-size: 0.875rem;">
          Aguardando execução...
        </div>
      </div>

      <div id="container-tabela" style="display: none;">
        <table class="tabela-testes">
          <thead>
            <tr>
              <th style="width: 70px;">ID</th>
              <th>Descrição do Cenário</th>
              <th style="width: 100px;">Status</th>
              <th>Evidências / Detalhes</th>
            </tr>
          </thead>
          <tbody id="corpo-tabela-testes"></tbody>
        </table>
      </div>

      <!-- Iframe isolado para hospedar o DOM real da calculadora e executar os testes -->
      <iframe
        id="iframe-app"
        src="./index.html"
        title="Ambiente isolado da Calculadora para testes"
        style="width: 1px; height: 1px; border: 0; position: absolute; left: -10000px; top: 0;"
      ></iframe>
    </main>
  </div>

  <script>
    const btnRodar = document.getElementById('btn-rodar-testes');
    const resumoEl = document.getElementById('resumo-geral');
    const containerTabela = document.getElementById('container-tabela');
    const corpoTabela = document.getElementById('corpo-tabela-testes');
    const iframeApp = document.getElementById('iframe-app');

    function atualizarLinhaTeste(teste) {
      const status = teste.status || (teste.passou ? 'APROVADO' : 'FALHOU');
      let linha = [...corpoTabela.rows].find(item => item.cells[0]?.textContent === teste.id);

      if (!linha) {
        linha = document.createElement('tr');
        for (let indice = 0; indice < 4; indice++) {
          linha.appendChild(document.createElement('td'));
        }
        corpoTabela.appendChild(linha);
      }

      const [celulaId, celulaDescricao, celulaStatus, celulaDetalhes] = linha.cells;
      celulaId.replaceChildren();
      const forte = document.createElement('strong');
      forte.textContent = teste.id;
      celulaId.appendChild(forte);
      celulaDescricao.textContent = teste.descricao;

      celulaStatus.replaceChildren();
      const tag = document.createElement('span');
      tag.className = 'tag-status ' + (status === 'APROVADO' ? 'tag-sucesso' : 'tag-falha');
      tag.textContent = status;
      celulaStatus.appendChild(tag);

      celulaDetalhes.textContent = teste.detalhes || '-';
      celulaDetalhes.style.fontSize = '0.75rem';
      celulaDetalhes.style.fontFamily = 'monospace';
    }

    function renderizarResultados(resultados) {
      let aprovados = 0;
      let falhas = 0;
      let naoExecutados = 0;

      for (const teste of resultados) {
        atualizarLinhaTeste(teste);
        if (teste.status === 'APROVADO' || teste.passou === true) aprovados++;
        else if (teste.status === 'NÃO EXECUTADO') naoExecutados++;
        else falhas++;
      }

      const total = resultados.length;
      const completos = total > 0 && aprovados + falhas + naoExecutados === total;
      const cemPorCento = completos && aprovados === total && falhas === 0 && naoExecutados === 0;
      resumoEl.textContent = completos
        ? `Resultado: ${aprovados}/${total} aprovados; ${falhas} falhas; ${naoExecutados} não executados (${cemPorCento ? '100% OK ✓' : 'REVISÃO NECESSÁRIA ✖'})`
        : `Relatório incompleto: ${aprovados} aprovados; ${falhas} falhas; ${naoExecutados} não executados de ${total}.`;
    }

    btnRodar.addEventListener('click', async () => {
      btnRodar.disabled = true;
      resumoEl.textContent = 'Aguardando carregamento do iframe e Pyodide...';
      containerTabela.style.display = 'block';

      try {
        const iframeWin = iframeApp.contentWindow;
        let tentativas = 0;

        while (
          (!iframeWin.calculadoraApp || !iframeWin.calculadoraApp.pyodidePronto()) &&
          tentativas < 80
        ) {
          await new Promise(resolve => setTimeout(resolve, 250));
          tentativas++;
        }

        if (!iframeWin.calculadoraApp || !iframeWin.calculadoraApp.pyodidePronto()) {
          resumoEl.textContent = 'Falha de inicialização: Pyodide indisponível. Nenhum cenário foi executado.';
          return;
        }

        iframeWin.documentContexto = iframeWin.document;
        const resultados = [];
        resumoEl.textContent = 'Executando testes...';
        const relatorio = await iframeWin.executarTodosOsTestesWeb(teste => {
          resultados.push(teste);
          atualizarLinhaTeste(teste);
        });
        renderizarResultados(Array.isArray(relatorio) ? relatorio : resultados);
      } catch (erro) {
        console.error('Falha inesperada no executor da suíte web:', erro);
        resumoEl.textContent = `Falha no executor: ${erro.message || String(erro)}. Resultado não considerado aprovado.`;
      } finally {
        btnRodar.disabled = false;
      }
    });

    // Mantém a execução automática da página de testes.
    window.addEventListener('load', () => {
      setTimeout(() => btnRodar.click(), 1000);
    });
  </script>
</body>
</html>
